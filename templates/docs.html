<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard API Documentation — Swagger UI</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0e16;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* ── Top Bar ── */
        .api-top-bar {
            background: #111827;
            border-bottom: 1px solid #1e2a3a;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .api-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #f1f5f9;
            font-weight: 800;
            font-size: 1.2rem;
        }
        .api-nav-links {
            display: flex;
            gap: 12px;
        }
        .api-nav-link {
            text-decoration: none;
            color: #94a3b8;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .api-nav-link:hover {
            color: #38bdf8;
            background: rgba(30, 41, 59, 0.6);
        }

        .pg-icon {
            display: inline-block;
            vertical-align: -2px;
            flex-shrink: 0;
        }

        /* ── Swagger UI Dark Overrides ── */
        .swagger-ui {
            filter: invert(88%) hue-rotate(180deg);
        }
        .swagger-ui .topbar { display: none; }
        .swagger-ui .info .title { color: #000000 !important; }
        #swagger-ui {
            max-width: 1080px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ── Mobile Responsiveness ── */
        @media (max-width: 640px) {
            .api-top-bar {
                flex-direction: column;
                gap: 12px;
                align-items: center;
                padding: 12px 14px;
                text-align: center;
            }
            .api-brand {
                font-size: 1.05rem;
            }
            .api-nav-links {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 6px;
                width: 100%;
            }
            .api-nav-link {
                font-size: 0.78rem;
                padding: 5px 8px;
            }
            #swagger-ui {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>

    <div class="api-top-bar">
        <a href="/" class="api-brand">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="PhishGuard" style="height: 28px;">
            <span>PhishGuard API Docs</span>
        </a>
        <div class="api-nav-links">
            <a href="/" class="api-nav-link">
                <svg class="pg-icon" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <span>Scanner</span>
            </a>
            <a href="/dashboard" class="api-nav-link">
                <svg class="pg-icon" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                <span>Threat Dashboard</span>
            </a>
            <a href="/openapi.json" target="_blank" class="api-nav-link" style="color: #38bdf8;">JSON Spec ↗</a>
        </div>
    </div>

    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
        window.onload = () => {
            window.ui = SwaggerUIBundle({
                url: "/openapi.json",
                dom_id: "#swagger-ui",
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIBundle.SwaggerUIStandalonePreset
                ]
            });
        };
    </script>
</body>
</html>
